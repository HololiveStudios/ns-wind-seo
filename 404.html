<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada | NS Wind</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Rajdhani:wght@700&display=swap">
  <style>
    :root{--deep:#040F38;--teal:#0181C1;--paper:#f4f9fd;--muted:#4e657a}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Outfit,system-ui,sans-serif;background:var(--paper);color:var(--deep);line-height:1.65}
    header{padding:1.2rem 1.5rem;background:#fff;border-bottom:1px solid rgba(1,129,193,.18)}
    header img{height:44px;width:auto}
    main{max-width:760px;margin:0 auto;padding:3rem 1.5rem 4rem}
    h1{font-family:Rajdhani,sans-serif;font-size:clamp(2rem,5vw,2.8rem);line-height:1.1;margin-bottom:1rem}
    h2{font-family:Rajdhani,sans-serif;font-size:1.4rem;margin:2rem 0 .4rem;color:var(--teal)}
    p,li{color:var(--muted)} ul{padding-left:1.2rem}
    a{color:var(--teal)}
    .btn{display:inline-block;margin-top:1.5rem;padding:.8rem 1.6rem;background:var(--teal);color:#fff;border-radius:8px;text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <header><a href="/"><img src="/assets/img/logo-nswind.webp" alt="NS Wind" height="44"></a></header>
  <main>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi removido. Volte ao início ou fale direto com a nossa equipe técnica.</p>
    <a class="btn" href="/">Voltar ao site</a>
    <a class="btn" href="/#contato" style="margin-left:.5rem">Contato técnico</a>
  </main>
</body>
</html>
